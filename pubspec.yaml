name: planish
description: "In-app feedback for Flutter: bugs, ideas and questions with an annotated screenshot, recent logs and device context, sent by email or to your own API."
version: 0.1.2
repository: https://github.com/kindware-dev/planish-flutter
issue_tracker: https://github.com/kindware-dev/planish-flutter/issues

topics:
  - feedback
  - bug-report
  - logging
  - debugging

platforms:
  android:
  ios:

screenshots:
  - description: "Reporting a bug: message, annotated screenshot, review, sent."
    path: doc/screenshots/demo.gif
  - description: The debug menu, in debug and profile builds.
    path: doc/screenshots/menu.png
  - description: The network log, with failed calls in red.
    path: doc/screenshots/network.png
  - description: The floating console over the running app.
    path: doc/screenshots/console.png

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  device_info_plus: ">=10.0.0 <14.0.0"
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_mailer: ^3.0.0
  http: ^1.5.0
  intl: ">=0.20.2 <0.21.0"
  package_info_plus: ">=8.0.0 <11.0.0"
  path_provider: ^2.1.4
  sensors_plus: ^7.0.0
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
